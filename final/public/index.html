<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>atypography generator</title>
</head>
<body>
    <div class="page-wrapper">
        <div class="header-container">
            <div class="controls">
                <div class="text-input-container">
                    <input type="text" id="text-input" placeholder="Type to generate text...">
                    <button id="generate-btn">→</button>
                </div>
                
                <div class="scale-controls">
                    <div class="control-group">
                        <label for="vertical-scale">|</label>
                        <input type="range" id="vertical-scale" min="1" max="30" value="10">
                        <span id="vertical-value">10</span>
                    </div>
                    <div class="control-group">
                        <label for="horizontal-scale">—</label>
                        <input type="range" id="horizontal-scale" min="1" max="30" value="10">
                        <span id="horizontal-value">10</span>
                    </div>
                    <div class="control-group">
                        <label for="line-thickness">±</label>
                        <input type="range" id="line-thickness" min="1" max="40" value="2">
                        <span id="thickness-value">2</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="layout-container" id="layout-container">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
